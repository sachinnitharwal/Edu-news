<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Blue Gradient -->
    <radialGradient id="bgGradient" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbe6ff"/>
      <stop offset="100%" stop-color="#73c2ff"/>
    </radialGradient>
    
    <!-- Glossy Reflection Effect -->
    <linearGradient id="glossGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Rings -->
  <circle cx="250" cy="250" r="240" fill="#ff5a00" />
  <circle cx="250" cy="250" r="225" fill="#ffffff" />
  
  <!-- Main Blue Background -->
  <circle cx="250" cy="250" r="215" fill="url(#bgGradient)" />

  <!-- Top Gloss Highlight -->
  <ellipse cx="250" cy="110" rx="150" ry="55" fill="url(#glossGradient)" />

  <!-- Base Typography -->
  <text x="50" y="290" font-family="'Arial Black', Impact, sans-serif" font-size="95" font-weight="900" textLength="145" lengthAdjust="spacingAndGlyphs" fill="#0a1b5c">Edu</text>
  <text x="200" y="290" font-family="'Arial Black', Impact, sans-serif" font-size="95" font-weight="900" textLength="215" lengthAdjust="spacingAndGlyphs" fill="#ff5a00">Naukr</text>

  <!-- Graduation Cap Vector (Over 'E') -->
  <g id="graduation-cap" fill="#0a1b5c">
    <!-- Top Diamond -->
    <polygon points="75,160 120,178 75,195 30,178" />
    <!-- Base Dome -->
    <path d="M 53,186 L 53,210 Q 75,225 97,210 L 97,186 Z" />
    <!-- Tassel String -->
    <path d="M 120,178 Q 130,190 123,215" fill="none" stroke="#0a1b5c" stroke-width="3"/>
    <!-- Tassel End -->
    <polygon points="120,215 126,215 130,232 116,232" />
  </g>

  <!-- Custom 'i' (Tie Shape Vector) -->
  <g id="tie-i">
    <!-- Blue Dot -->
    <circle cx="437" cy="180" r="14" fill="#0a1b5c" />
    <!-- Orange Tie Knot -->
    <polygon points="425,210 449,210 442,228 432,228" fill="#ff5a00" />
    <!-- Orange Tie Body -->
    <polygon points="432,228 442,228 450,265 437,290 424,265" fill="#ff5a00" />
  </g>
</svg>
