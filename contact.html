<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — EduNaukri</title>
<link rel="stylesheet" href="style.css">
<style>
    .page-container { max-width: 800px; margin: 40px auto; background: #fff; padding: 50px; border-radius: 12px; box-shadow: 0 4px 15px #102a4308; border: 1px solid var(--border); }
    .page-title { font-size: 32px; color: var(--navy); margin: 0 0 15px 0; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
    .contact-info { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
    .contact-card { flex: 1; min-width: 200px; background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
    .contact-card h3 { margin: 0 0 10px; color: var(--blue); }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; background: var(--bg); transition: border 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--blue); }
    .form-group textarea { min-height: 150px; resize: vertical; }
    .submit-btn { background: var(--blue); color: #fff; border: none; padding: 15px 30px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 16px; transition: background 0.2s; width: 100%; }
    .submit-btn:hover { background: var(--navy); }

    @media(max-width: 768px) {
        .page-container { padding: 25px 15px; margin-top: 0; border-radius: 0; border: none; box-shadow: none; }
    }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
  <a class="brand" href="index.html"><img src="logo.png" alt="EduNaukri logo" onerror="this.style.display='none'">Edu<span>Naukri</span></a>
  <button class="hamburger" id="hamburgerMenu">☰</button>
  <div class="menu" id="navMenu">
    <a href="index.html">Home</a>
    <a href="index.html#jobs">Government Jobs</a>
    <a href="about.html">About Us</a>
  </div>
</nav>

<main class="container">
    <div class="page-container">
        <h1 class="page-title">Contact Us</h1>
        <p style="color: var(--muted); line-height: 1.6; margin-bottom: 30px;">Have a question about a job notification, admit card, or facing issues with our website? Fill out the form below or reach out to us directly.</p>
        
        <div class="contact-info">
            <div class="contact-card">
                <h3>📧 Email Us</h3>
                <p style="margin:0; color:var(--text); font-weight: 500;">info@edunaukri.com</p>
            </div>
            <div class="contact-card">
                <h3>💬 Telegram</h3>
                <p style="margin:0; color:var(--text); font-weight: 500;">@EduNaukri_Support</p>
            </div>
        </div>

        <form onsubmit="event.preventDefault(); alert('Thanks for contacting us! We will get back to you soon.'); this.reset();">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email address" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="copy">© 2026 EduNaukri. All Rights Reserved.</div>
</footer>
<script>
        // --- Mobile Hamburger Menu Logic ---
    const hamburger = document.getElementById('hamburgerMenu');
    const navMenu = document.getElementById('navMenu');

    if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
            // Toggle the menu visibility
            navMenu.classList.toggle('show-menu');
            
            // Change icon from Hamburger (☰) to Close (✕)
            if (navMenu.classList.contains('show-menu')) {
                hamburger.innerHTML = '✕';
                hamburger.style.transform = 'rotate(90deg)';
            } else {
                hamburger.innerHTML = '☰';
                hamburger.style.transform = 'rotate(0deg)';
            }
        });

        // Close the menu automatically when any link is clicked
        document.querySelectorAll('.menu a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('show-menu');
                hamburger.innerHTML = '☰';
                hamburger.style.transform = 'rotate(0deg)';
            });
        });
    }

</script>
<script src="script.js"></script>
</body>
</html>
