<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduNaukri - Latest government and private jobs, admit cards, results and notifications.">
  <title>Job Details — EduNaukri</title>
  
  <!-- Load the official Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* =========================================
       BASE VARIABLES & RESET (PREMIUM SAAS LOOK)
    ========================================= */
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
        --blue: #2563EB;
        --blue-dark: #1E40AF;
        --navy: #0F172A;
        --orange: #F97316;
        --bg: #F8FAFC;
        --card: #FFFFFF;
        --text: #1E293B;
        --muted: #64748B;
        --border: #E2E8F0;
        --shadow-soft: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
        --shadow-hover: 0 20px 40px -5px rgba(37, 99, 235, 0.1);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; transition: all 0.3s ease; }

    /* =========================================
       NAVIGATION (GLASSMORPHISM)
    ========================================= */
    .top { background: var(--navy); color: #CBD5E1; padding: 8px 5%; font-size: 13px; display: flex; justify-content: space-between; font-weight: 500; }
    .social-links span { color: #fff; cursor: pointer; transition: color 0.3s; }
    .social-links span:hover { color: var(--orange); }

    .nav {
        height: 80px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 5%; border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        position: sticky; top: 0; z-index: 1000;
    }

    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 26px; color: var(--navy); letter-spacing: -0.5px; }
    .brand img { width: 44px; height: 44px; object-fit: contain; }
    .brand span { color: var(--blue); }

    .menu { display: flex; gap: 8px; align-items: center; }
    .menu a { font-size: 15px; font-weight: 600; color: var(--muted); padding: 8px 16px; border-radius: 8px; }
    .menu a:hover, .menu a.active { color: var(--blue); background: #EFF6FF; }

    .hamburger { display: none; font-size: 26px; background: none; border: none; color: var(--navy); cursor: pointer; }

    /* =========================================
       JOB DETAILS CONTAINER
    ========================================= */
    .container { max-width: 1000px; margin: auto; padding: 0 20px 80px; }

    .details-container {
        background: var(--card);
        padding: 50px 60px;
        border-radius: 24px;
        box-shadow: var(--shadow-soft);
        border: 1px solid var(--border);
        min-height: 50vh;
        margin-top: 40px;
    }
    
    .back-btn { 
        display: inline-flex; align-items: center; gap: 8px; margin-bottom: 30px; 
        color: var(--muted); font-weight: 700; font-size: 14px; 
        background: var(--bg); padding: 10px 18px; border-radius: 12px;
        border: 1px solid var(--border); transition: all 0.3s;
    }
    .back-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); transform: translateX(-4px); }

    .job-header { border-bottom: 2px dashed var(--border); padding-bottom: 25px; margin-bottom: 35px; }
    .job-title { font-size: 36px; font-weight: 800; color: var(--navy); margin: 0 0 20px 0; line-height: 1.3; letter-spacing: -0.5px; }

    .job-meta { display: flex; flex-wrap: wrap; gap: 12px; }
    .meta-tag {
        background: #EFF6FF; color: var(--blue); padding: 8px 16px; 
        border-radius: 8px; font-weight: 700; font-size: 14px;
        display: flex; align-items: center; gap: 6px; border: 1px solid #BFDBFE;
    }
    .meta-tag:nth-child(2) { background: #FEF2F2; color: #E11D48; border-color: #FECDD3; }
    .meta-tag:nth-child(3) { background: #F8FAFC; color: var(--muted); border-color: var(--border); }

    /* =========================================
       INJECTED HTML CONTENT STYLING
    ========================================= */
    .job-content-wrapper { overflow-x: auto; } /* Fixes mobile table overflow */
    
    .job-content { line-height: 1.8; color: #334155; font-size: 16px; }
    .job-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 20px 0; box-shadow: var(--shadow-soft); }
    
    .job-content h2, .job-content h3 {
        color: var(--navy); font-weight: 800; margin-top: 40px; margin-bottom: 20px;
        position: relative; display: inline-block;
    }
    .job-content h2::after, .job-content h3::after {
        content: ''; position: absolute; bottom: -5px; left: 0; width: 40%; height: 3px; 
        background: var(--blue); border-radius: 4px;
    }
    
    /* Premium Table Styles */
    .job-content table {
        width: 100%; border-collapse: collapse; margin: 30px 0;
        background: var(--card); border-radius: 12px; overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border);
    }
    .job-content th, .job-content td { border: 1px solid var(--border); padding: 16px; text-align: left; }
    .job-content th { background: #F1F5F9; color: var(--navy); font-weight: 700; font-size: 15px; }
    .job-content tr:hover td { background: #F8FAFC; }
    
    .job-content a { color: var(--blue); font-weight: 600; text-decoration: underline; }
    .job-content a:hover { color: var(--orange); }

    .status-msg { text-align: center; font-size: 18px; font-weight: 600; color: var(--muted); padding: 60px 0; }

    /* =========================================
       RELATED JOBS SECTION
    ========================================= */
    .related-jobs { margin-top: 60px; padding-top: 40px; border-top: 2px dashed var(--border); }
    .related-jobs h3 { color: var(--navy); font-size: 24px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
    
    .related-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .related-card {
        background: var(--card); border: 1px solid var(--border); border-radius: 16px;
        padding: 24px; text-decoration: none; display: flex; flex-direction: column;
        transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .related-card:hover { border-color: #BFDBFE; box-shadow: var(--shadow-hover); transform: translateY(-4px); }
    
    .related-tag {
        font-size: 12px; background: #F1F5F9; color: var(--navy); padding: 6px 10px;
        border-radius: 6px; display: inline-block; margin-bottom: 15px; font-weight: 700;
    }
    .related-title { font-size: 16px; font-weight: 700; line-height: 1.5; margin: 0 0 20px 0; color: var(--text); }
    .related-card:hover .related-title { color: var(--blue); }
    .read-more { font-size: 14px; color: var(--blue); font-weight: 700; margin-top: auto; display: flex; align-items: center; gap: 5px; }
    .read-more::after { content: '→'; transition: transform 0.2s; }
    .related-card:hover .read-more::after { transform: translateX(4px); }

    /* =========================================
       FLOATING WHATSAPP BUTTON
    ========================================= */
    .floating-wa {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #25D366;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
        z-index: 999;
        text-decoration: none;
        animation: pulse 2s infinite;
        transition: all 0.3s ease;
    }
    .floating-wa:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 30px rgba(37, 211, 102, 0.5); }
    .floating-wa svg { width: 24px; height: 24px; fill: currentColor; }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
        70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
        100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    /* =========================================
       MOBILE RESPONSIVENESS
    ========================================= */
    @media(max-width: 900px) {
        .hamburger { display: block; }
        .menu { display: none; position: absolute; top: 80px; left: 0; width: 100%; background: #fff; flex-direction: column; padding: 20px; margin: 0; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border-top: 1px solid var(--border); }
        .menu.show-menu { display: flex; animation: fadeInDown 0.2s ease forwards; }
        .menu a { width: 100%; text-align: center; padding: 14px; background: var(--bg); margin: 4px 0; }
    }

    @media(max-width: 768px) {
        body { background: #fff; } 
        .top { display: none; }
        .nav { height: 70px; }
        .brand { font-size: 22px; } .brand img { width: 36px; height: 36px; }
        .container { padding: 0 !important; }
        .details-container { padding: 30px 20px; margin-top: 0; border-radius: 0; border: none; box-shadow: none; min-height: auto; }
        .job-title { font-size: 26px; }
        
        .job-content table { font-size: 13px; }
        .job-content th, .job-content td { padding: 10px 8px; }
        .related-grid { grid-template-columns: 1fr; }
        
        /* Adjust Floating Button for Mobile */
        .floating-wa { bottom: 20px; right: 20px; padding: 12px 18px; font-size: 14px; }
    }
  </style>
</head>
<body>

<!-- Modern Glassmorphism Navigation -->
<nav class="nav">
  <a class="brand" href="index.html"><img src="logo.png" alt="EduNaukri logo" onerror="this.style.display='none'">Edu<span>Naukri</span></a>
  <button class="hamburger" id="hamburgerMenu">☰</button>
  <div class="menu" id="navMenu">
    <a href="index.html">Home</a>
    <a href="index.html#jobs">Latest Jobs</a>
    <a href="index.html#admit-cards">Admit Card</a>
    <a href="index.html#results">Results</a>
    <a href="index.html#others">Others</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact Us</a>
  </div>
</nav>

<main class="container">
    <div class="details-container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <!-- Loading State -->
        <div id="loading" class="status-msg">Loading premium details...</div>
        
        <!-- Error State -->
        <div id="errorMsg" class="status-msg" style="display: none; color: #E11D48;"></div>
        
        <!-- Main Content Area -->
        <div id="postContainer" style="display: none;">
            <div class="job-header">
                <h1 class="job-title" id="displayTitle"></h1>
                <div class="job-meta">
                    <span class="meta-tag" id="displayCategory"></span>
                    <span class="meta-tag" id="displayState"></span>
                    <span class="meta-tag" id="displayDate"></span>
                </div>
            </div>
            
            <!-- Raw HTML injected here, wrapped for mobile table scrolling -->
            <div class="job-content-wrapper">
                <div class="job-content" id="displayContent"></div>
            </div>

            <!-- 🔥 Related Jobs Section -->
            <div class="related-jobs" id="relatedJobsSection" style="display: none;">
                <h3>🔥 You May Also Like</h3>
                <div class="related-grid" id="relatedGrid">
                    <!-- Cards will be injected by JavaScript here -->
                </div>
            </div>

        </div>
    </div>
</main>

<!-- Floating WhatsApp Button -->
<a href="YOUR_WHATSAPP_GROUP_LINK" class="floating-wa" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    Join WhatsApp Group
</a>

<script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'https://coeemddusgoafawggwsl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_5k4N3lBwJ8QOS7sv1y11IA_uaqWCdt1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Fetch the ID from the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    async function fetchPostDetails() {
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');
        const postContainer = document.getElementById('postContainer');

        if (!postId) {
            loading.style.display = 'none';
            errorMsg.innerText = "Error: No job ID provided.";
            errorMsg.style.display = 'block';
            return;
        }

        try {
            // 3. Query the database for current post
            const { data, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('id', postId)
                .single(); 

            if (error) throw error;

            // 4. Populate the HTML elements
            document.title = `${data.title} — EduNaukri`;
            
            document.getElementById('displayTitle').innerText = data.title;
            
            // Adjust category text display based on the homepage changes
            let readableCategory = data.category.replace('-', ' ').toUpperCase();
            if (data.category === 'answer-keys') readableCategory = 'OTHERS';
            if (data.category === 'syllabus') readableCategory = 'SARKARI YOJANA';
            
            document.getElementById('displayCategory').innerText = `📂 ${readableCategory}`;
            document.getElementById('displayState').innerText = `📍 ${data.state.toUpperCase()}`;
            
            const dateStr = new Date(data.created_at).toLocaleDateString('en-IN', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            document.getElementById('displayDate').innerText = `📅 ${dateStr}`;
            
            document.getElementById('displayContent').innerHTML = data.content_html;

            loading.style.display = 'none';
            postContainer.style.display = 'block';

            // 5. Fetch Related Jobs
            fetchRelatedJobs(postId, data.category);

        } catch (error) {
            console.error("Error fetching post details:", error);
            loading.style.display = 'none';
            errorMsg.innerText = "Error: Post not found or has been removed.";
            errorMsg.style.display = 'block';
        }
    }

    // Fetch 3 other jobs
    async function fetchRelatedJobs(currentPostId, currentCategory) {
        try {
            const { data, error } = await supabaseClient
                .from('jobs')
                .select('id, title, category')
                .neq('id', currentPostId)
                .order('created_at', { ascending: false })
                .limit(3);

            if (error) throw error;

            if (data && data.length > 0) {
                const relatedGrid = document.getElementById('relatedGrid');
                relatedGrid.innerHTML = data.map(job => {
                    let cardCat = job.category.toUpperCase().replace('-', ' ');
                    if (job.category === 'answer-keys') cardCat = 'OTHERS';
                    if (job.category === 'syllabus') cardCat = 'SARKARI YOJANA';
                    
                    return `
                    <a href="job-details.html?id=${job.id}" class="related-card">
                        <span class="related-tag">${cardCat}</span>
                        <h4 class="related-title">${job.title}</h4>
                        <div class="read-more">View Details</div>
                    </a>
                `}).join('');
                
                document.getElementById('relatedJobsSection').style.display = 'block';
            }
        } catch (error) {
            console.error("Error fetching related jobs:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchPostDetails);

    // --- Mobile Hamburger Menu Logic ---
    const hamburger = document.getElementById('hamburgerMenu');
    const navMenu = document.getElementById('navMenu');

    if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('show-menu');
            if (navMenu.classList.contains('show-menu')) {
                hamburger.innerHTML = '✕';
                hamburger.style.transform = 'rotate(90deg)';
            } else {
                hamburger.innerHTML = '☰';
                hamburger.style.transform = 'rotate(0deg)';
            }
        });

        document.querySelectorAll('.menu a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('show-menu');
                hamburger.innerHTML = '☰';
                hamburger.style.transform = 'rotate(0deg)';
            });
        });
    }
</script>
</body>
</html>
