<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Details — EduNaukri</title>
<link rel="stylesheet" href="style.css">
<!-- Load the official Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    /* Details Page Content Area */
    .details-container {
        width: 100%; 
        background: #fff;
        padding: 40px 50px;
        border-radius: 12px;
        box-shadow: 0 4px 15px #102a4308;
        border: 1px solid var(--border);
        min-height: 50vh;
        margin-top: 20px;
    }
    
    .job-header {
        border-bottom: 2px solid var(--border);
        padding-bottom: 20px;
        margin-bottom: 30px;
    }

    .job-title {
        font-size: 32px;
        color: var(--navy);
        margin: 0 0 15px 0;
        line-height: 1.4;
    }

    .job-meta {
        font-size: 14px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
    }

    .meta-tag {
        background: var(--bg);
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    /* Styles for the HTML content injected from the database */
    .job-content {
        line-height: 1.8;
        color: var(--text);
        font-size: 16px;
        overflow-wrap: break-word;
    }
    
    .job-content img { max-width: 100%; height: auto; border-radius: 8px; }
    
    .job-content h2, .job-content h3 {
        color: var(--blue);
        margin-top: 35px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
    }
    
    /* Auto-Fitting Table Styles */
    .job-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 25px 0;
        table-layout: fixed; 
        word-wrap: break-word; 
    }
    .job-content th, .job-content td { border: 1px solid var(--border); padding: 14px; text-align: left; }
    .job-content th { background: var(--bg); color: var(--navy); font-weight: 700; }
    
    .status-msg { text-align: center; font-size: 18px; color: var(--muted); padding: 50px 0; }
    .back-btn { display: inline-block; margin-bottom: 25px; color: var(--blue); font-weight: 700; text-decoration: none; font-size: 15px; }
    .back-btn:hover { text-decoration: underline; }

    /* --- Related Jobs Section Styles --- */
    .related-jobs {
        margin-top: 50px;
        padding-top: 30px;
        border-top: 2px dashed var(--border);
    }
    .related-jobs h3 {
        color: var(--navy);
        font-size: 22px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .related-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 15px;
    }
    .related-card {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
        text-decoration: none;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
    }
    .related-card:hover {
        background: #fff;
        border-color: var(--blue);
        box-shadow: 0 8px 20px rgba(7, 87, 217, 0.08);
        transform: translateY(-3px);
    }
    .related-tag {
        font-size: 11px;
        background: #e2e8f0;
        color: var(--navy);
        padding: 4px 8px;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 10px;
        font-weight: 700;
    }
    .related-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin: 0 0 15px 0;
        color: #d11515; /* Matches homepage link red */
    }
    .related-card:hover .related-title { color: var(--blue); }
    .read-more {
        font-size: 13px;
        color: var(--blue);
        font-weight: 700;
        margin-top: auto;
    }
    .read-more::after { content: ' →'; }

    /* Mobile Responsive Adjustments */
    @media(max-width: 768px) {
        body { background: #fff; } 
        .container { padding: 0 !important; }
        .details-container { padding: 20px 15px; margin-top: 0; border-radius: 0; border: none; box-shadow: none; }
        .job-title { font-size: 24px; }
        .job-content table { font-size: 12px; margin: 15px 0; }
        .job-content th, .job-content td { padding: 6px 4px; overflow-wrap: break-word; word-break: break-all; }
        
        .related-grid { grid-template-columns: 1fr; } /* Stack related jobs vertically on mobile */
    }
</style>
</head>
<body>

<!-- Navigation for Inner Pages -->
<nav class="nav">
  <a class="brand" href="index.html"><img src="logo.png" alt="EduNaukri logo" onerror="this.style.display='none'">Edu<span>Naukri</span></a>
  <button class="hamburger" id="hamburgerMenu">☰</button>
  <div class="menu" id="navMenu">
    <a href="index.html">Home</a>
    <a href="index.html#jobs">Latest Jobs</a>
    <a href="index.html#admit-cards">Admit Card</a>
    <a href="index.html#results">Results</a>
    <a href="index.html#answer-keys">Answer Key</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact Us</a>
  </div>
</nav>

<main class="container">
    <div class="details-container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <!-- Loading State -->
        <div id="loading" class="status-msg">Loading details...</div>
        
        <!-- Error State -->
        <div id="errorMsg" class="status-msg" style="display: none; color: #e92738;"></div>
        
        <!-- Main Content Area -->
        <div id="postContainer" style="display: none;">
            <div class="job-header">
                <h1 class="job-title" id="displayTitle"></h1>
                <div class="job-meta">
                    <span class="meta-tag" id="displayCategory"></span>
                    <span class="meta-tag" id="displayState"></span>
                    <span class="meta-tag" id="displayDate"></span>
                </div>
            </div>
            
            <!-- Raw HTML injected here -->
            <div class="job-content" id="displayContent"></div>

            <!-- 🔥 Related Jobs Section (New) -->
            <div class="related-jobs" id="relatedJobsSection" style="display: none;">
                <h3>🔥 You May Also Like</h3>
                <div class="related-grid" id="relatedGrid">
                    <!-- Cards will be injected by JavaScript here -->
                </div>
            </div>

        </div>
    </div>
</main>

<!-- Footer -->
<footer class="footer">
  <div class="copy">© 2026 EduNaukri. All Rights Reserved.</div>
</footer>

<script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'https://coeemddusgoafawggwsl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_5k4N3lBwJ8QOS7sv1y11IA_uaqWCdt1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Fetch the ID from the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    async function fetchPostDetails() {
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');
        const postContainer = document.getElementById('postContainer');

        if (!postId) {
            loading.style.display = 'none';
            errorMsg.innerText = "Error: No job ID provided.";
            errorMsg.style.display = 'block';
            return;
        }

        try {
            // 3. Query the database for current post
            const { data, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('id', postId)
                .single(); 

            if (error) throw error;

            // 4. Populate the HTML elements
            document.title = `${data.title} — EduNaukri`;
            
            document.getElementById('displayTitle').innerText = data.title;
            document.getElementById('displayCategory').innerText = `📂 ${data.category.toUpperCase().replace('-', ' ')}`;
            document.getElementById('displayState').innerText = `📍 ${data.state.toUpperCase()}`;
            
            const dateStr = new Date(data.created_at).toLocaleDateString('en-IN', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            document.getElementById('displayDate').innerText = `📅 ${dateStr}`;
            
            document.getElementById('displayContent').innerHTML = data.content_html;

            loading.style.display = 'none';
            postContainer.style.display = 'block';

            // 5. Fetch Related Jobs (🔥 NEW FEATURE)
            fetchRelatedJobs(postId, data.category);

        } catch (error) {
            console.error("Error fetching post details:", error);
            loading.style.display = 'none';
            errorMsg.innerText = "Error: Post not found or has been removed.";
            errorMsg.style.display = 'block';
        }
    }

    // Function to grab 3 other jobs from the database
    async function fetchRelatedJobs(currentPostId, currentCategory) {
        try {
            // Fetch 3 latest jobs excluding the current one
            const { data, error } = await supabaseClient
                .from('jobs')
                .select('id, title, category')
                .neq('id', currentPostId)
                .order('created_at', { ascending: false })
                .limit(3);

            if (error) throw error;

            if (data && data.length > 0) {
                const relatedGrid = document.getElementById('relatedGrid');
                relatedGrid.innerHTML = data.map(job => `
                    <a href="job-details.html?id=${job.id}" class="related-card">
                        <span class="related-tag">${job.category.toUpperCase().replace('-', ' ')}</span>
                        <h4 class="related-title">${job.title}</h4>
                        <div class="read-more">View Details</div>
                    </a>
                `).join('');
                
                document.getElementById('relatedJobsSection').style.display = 'block';
            }
        } catch (error) {
            console.error("Error fetching related jobs:", error);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchPostDetails);

    // --- Mobile Hamburger Menu Logic ---
    const hamburger = document.getElementById('hamburgerMenu');
    const navMenu = document.getElementById('navMenu');

    if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('show-menu');
            if (navMenu.classList.contains('show-menu')) {
                hamburger.innerHTML = '✕';
                hamburger.style.transform = 'rotate(90deg)';
            } else {
                hamburger.innerHTML = '☰';
                hamburger.style.transform = 'rotate(0deg)';
            }
        });

        document.querySelectorAll('.menu a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('show-menu');
                hamburger.innerHTML = '☰';
                hamburger.style.transform = 'rotate(0deg)';
            });
        });
    }
</script>
</body>
</html>
