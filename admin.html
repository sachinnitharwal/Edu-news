<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduNaukri — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root { --blue: #2563EB; --blue-dark: #1E40AF; --navy: #0F172A; --orange: #F97316; --bg: #F8FAFC; --card: #FFFFFF; --text: #1E293B; --muted: #64748B; --border: #E2E8F0; --shadow-soft: 0 10px 30px -5px rgba(15, 23, 42, 0.05); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); background: var(--bg); padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
  .nav { height: 80px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; border-bottom: 1px solid rgba(226, 232, 240, 0.8); position: sticky; top: 0; z-index: 1000; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 24px; color: var(--navy); text-decoration: none; letter-spacing: -0.5px; }
  .brand span { color: var(--blue); }
  .logout-btn { background: #FFF1F2; border: 1px solid #FECDD3; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; color: #E11D48; transition: all 0.3s ease; font-family: inherit; }
  .logout-btn:hover { background: #E11D48; color: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2); }
  .admin-container { max-width: 850px; margin: 50px auto 20px; background: var(--card); padding: 40px 50px; border-radius: 24px; box-shadow: var(--shadow-soft); border: 1px solid var(--border); }
  .admin-header { margin-bottom: 30px; position: relative; padding-bottom: 15px; }
  .admin-header::after { content: ''; position: absolute; bottom: 0; left: 0; height: 4px; width: 50px; background: var(--orange); border-radius: 4px; }
  .admin-header h2 { margin: 0; color: var(--navy); font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .form-group { margin-bottom: 25px; }
  .form-group label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 14px; color: var(--navy); }
  .form-group input[type="text"], .form-group select, .form-group textarea { width: 100%; padding: 16px 20px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; background: #F8FAFC; transition: all 0.3s ease; font-family: inherit; color: var(--navy); }
  .form-group input[type="text"]:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
  .form-group textarea { min-height: 250px; resize: vertical; font-family: monospace; line-height: 1.5; }
  .checkbox-group { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 700; margin-bottom: 30px; background: #FEF2F2; padding: 15px 20px; border-radius: 12px; border: 1px solid #FECDD3; width: fit-content; }
  .checkbox-group input { width: 20px; height: 20px; cursor: pointer; accent-color: #E11D48; }
  .btn { background: var(--blue); color: #fff; border: none; padding: 18px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; font-size: 16px; transition: all 0.3s ease; font-family: inherit; }
  .btn:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2); }
  .btn:disabled { background: #94A3B8; cursor: not-allowed; transform: none; box-shadow: none; }
  #statusMessage { margin-top: 20px; font-weight: 700; text-align: center; font-size: 15px; min-height: 20px; }
  .manage-list { list-style: none; padding: 0; margin: 0; }
  .manage-list li { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px dashed var(--border); gap: 20px; }
  .manage-list li:last-child { border-bottom: none; padding-bottom: 0; }
  .post-info { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .post-title { font-weight: 700; font-size: 16px; color: var(--navy); line-height: 1.4; }
  .post-meta { font-size: 13px; color: var(--muted); font-weight: 600; background: var(--bg); width: fit-content; padding: 4px 10px; border-radius: 6px; }
  .del-btn { background: #FFF1F2; color: #E11D48; border: 1px solid #FECDD3; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.3s ease; font-family: inherit; }
  .del-btn:hover { background: #E11D48; color: #fff; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2); transform: translateY(-2px); }
  @media(max-width: 768px) { .admin-container { padding: 30px 20px; margin: 30px 15px; border-radius: 20px; } .manage-list li { flex-direction: column; align-items: flex-start; } .del-btn { width: 100%; text-align: center; } }
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">Edu<span>Naukri</span>&nbsp;Admin</a>
  <button id="logoutBtn" class="logout-btn">Logout</button>
</nav>

<!-- CREATE POST SECTION -->
<div class="admin-container">
  <div class="admin-header">
    <h2>📝 Publish New Update</h2>
  </div>
  
  <form id="adminForm">
    <div class="form-group">
      <label for="postTitle">Post Title (Headline)</label>
      <input type="text" id="postTitle" placeholder="e.g. Rajasthan Police Constable Recruitment" required>
    </div>

    <div class="form-group">
      <label for="postCategory">Main Column (Category)</label>
      <select id="postCategory" required>
        <!-- DB VALUES REVERTED, DISPLAY REMAINS NEW -->
        <option value="jobs">🔥 Latest Jobs</option>
        <option value="admit-cards">🪪 Admit Card</option>
        <option value="results">📊 Result</option>
        <option value="answer-keys">🌟 Others</option>
        <option value="admission">🎓 Admission & Updates</option>
        <option value="syllabus">🏛️ Sarkari Yojana</option>
      </select>
    </div>

    <div class="form-group">
      <label for="postState">State Filter</label>
      <select id="postState" required>
        <option value="rajasthan">Rajasthan</option>
        <option value="central">Central</option>
        <option value="other">Other States</option>
      </select>
    </div>

    <div class="form-group">
      <label for="postTags">Tags / Keywords (सर्च टैग्स)</label>
      <input type="text" id="postTags" placeholder="e.g. police, constable, 12th pass">
      <small style="color: var(--muted); font-size: 13px; display: block; margin-top: 8px; font-weight: 500;">निर्देश: कॉमा (,) लगाकर वे शब्द लिखें जिन्हें यूज़र सर्च कर सकता है। इससे सर्च बार में यह पोस्ट आसानी से मिलेगी।</small>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="isNew">
      <label for="isNew" style="margin:0; color:#E11D48; cursor: pointer;">Mark with "NEW" Badge</label>
    </div>

    <div class="form-group">
      <label for="postContent">Full Post Details (Paste HTML Here)</label>
      <textarea id="postContent" placeholder="Paste your HTML code here (e.g., <h3>Requirements</h3> <p>10th pass...</p>)" required></textarea>
    </div>

    <button type="submit" class="btn" id="submitBtn">Publish Post</button>
    <div id="statusMessage"></div>
  </form>
</div>

<!-- MANAGE POSTS SECTION -->
<div class="admin-container" style="margin-top: 30px;">
  <div class="admin-header">
    <h2>🗑️ Manage Existing Posts</h2>
  </div>
  <ul id="managePostsList" class="manage-list">
    <li>Loading posts...</li>
  </ul>
</div>

<script>
  const SUPABASE_URL = 'https://coeemddusgoafawggwsl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_5k4N3lBwJ8QOS7sv1y11IA_uaqWCdt1';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.replace('login.html'); } else { fetchManagePosts(); }
  }
  checkAuth();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.replace('login.html');
  });

  async function fetchManagePosts() {
      const list = document.getElementById('managePostsList');
      list.innerHTML = '<li>Loading posts...</li>';

      const { data, error } = await supabaseClient
          .from('jobs')
          .select('id, title, category, created_at')
          .order('created_at', { ascending: false });

      if (error) {
          list.innerHTML = `<li style="color: #E11D48; font-weight: 600;">Error loading posts: ${error.message}</li>`;
          return;
      }
      if (data.length === 0) {
          list.innerHTML = `<li style="font-weight: 500; color: var(--muted);">No posts found. Publish one above!</li>`;
          return;
      }

      list.innerHTML = '';
      data.forEach(post => {
          const date = new Date(post.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
          
          let cleanCategory = post.category ? post.category.replace('-', ' ').toUpperCase() : 'UNKNOWN';
          if(post.category === 'answer-keys') cleanCategory = 'OTHERS';
          if(post.category === 'syllabus') cleanCategory = 'SARKARI YOJANA';
          
          list.innerHTML += `
              <li>
                  <div class="post-info">
                      <span class="post-title">${post.title}</span>
                      <span class="post-meta">📂 ${cleanCategory} &nbsp; • &nbsp; 🗓️ ${date}</span>
                  </div>
                  <button class="del-btn" onclick="deletePost(${post.id})">Delete Post</button>
              </li>
          `;
      });
  }

  window.deletePost = async function(id) {
      if (!confirm("Are you sure you want to delete this post? This cannot be undone.")) { return; }
      const { error } = await supabaseClient.from('jobs').delete().eq('id', id);
      if (error) { alert("Error deleting post: " + error.message); } else { fetchManagePosts(); }
  };

  document.getElementById('adminForm').addEventListener('submit', async function(e) {
    e.preventDefault(); 
    
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('statusMessage');
    
    submitBtn.disabled = true;
    submitBtn.innerText = "Publishing...";
    status.innerText = "";
    
    const postData = {
      title: document.getElementById('postTitle').value.trim(),
      category: document.getElementById('postCategory').value,
      state: document.getElementById('postState').value,
      tags: document.getElementById('postTags').value.trim(), 
      is_new: document.getElementById('isNew').checked,
      content_html: document.getElementById('postContent').value.trim()
    };
    
    try {
        const { data, error } = await supabaseClient.from('jobs').insert([postData]);
        if (error) throw error;

        status.style.color = "#059669";
        status.innerText = "✅ Post successfully saved to database!";
        this.reset(); 
        fetchManagePosts();
        
    } catch (error) {
        console.error("Error saving post:", error);
        status.style.color = "#E11D48";
        status.innerText = "❌ Error: " + error.message;
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Publish Post";
        setTimeout(() => { if(status.style.color === "rgb(5, 150, 105)") status.innerText = ""; }, 4000);
    }
  });
</script>
</body>
</html>
